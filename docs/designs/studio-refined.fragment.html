<div id="gym-studio-refined">
<style>
#gym-studio-refined{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color-scheme:light dark}
#gym-studio-refined .sr-stage{padding:22px 8px}
#gym-studio-refined .sr-preview{max-width:390px;margin:auto}
#gym-studio-refined .sr-review{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:0 0 12px;font-size:11px;letter-spacing:1px;color:light-dark(#535d50,#c2c9b9)}
#gym-studio-refined .sr-review select{background:light-dark(#edece6,#2a3027);color:inherit;border:0;border-radius:8px;padding:8px;font:inherit;min-height:44px;max-width:185px}
#gym-studio-refined .sr-app{--canvas:light-dark(#f5f2e9,#1c211b);--surface:light-dark(#e7e5d9,#2b3328);--text:light-dark(#283529,#f1f3e6);--secondary:light-dark(#5c6658,#b9c3ae);--line:light-dark(#c8ccbc,#475140);--action:light-dark(#354c27,#d6ef81);--on-action:light-dark(#f6f8ed,#26331c);--selected:light-dark(#e1edbb,#3a4629);--error:light-dark(#a62331,#ffb0b4);--heading:Georgia,'Times New Roman',serif;--radius:14px;--gap:12px;background:var(--canvas);color:var(--text);border-radius:28px;min-height:680px;display:flex;flex-direction:column;box-shadow:0 15px 40px #00000012;font-size:14px;line-height:1.4;overflow-wrap:anywhere}
#gym-studio-refined .sr-app[data-theme="Velocity"]{--canvas:light-dark(#f1f3f8,#10151f);--surface:light-dark(#e3e8f2,#1d2738);--text:light-dark(#101b30,#edf2ff);--secondary:light-dark(#515e72,#b0bed4);--line:light-dark(#c6ccda,#354056);--action:light-dark(#234bdb,#9bb8ff);--on-action:light-dark(#fff,#101b30);--selected:light-dark(#dce6ff,#273c65);--error:light-dark(#ae253d,#ffadb9);--heading:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
#gym-studio-refined .sr-safe{display:flex;justify-content:space-between;padding:14px 20px 4px;font-size:11px;font-weight:600}
#gym-studio-refined .sr-header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 18px}
#gym-studio-refined .sr-brand{font-family:var(--heading);font-size:22px;letter-spacing:-1px}
#gym-studio-refined .sr-main{padding:8px 18px 16px;flex:1}
#gym-studio-refined h1{font-family:var(--heading);font-size:29px;font-weight:400;line-height:1.15;letter-spacing:-.8px;margin:4px 0 10px}
#gym-studio-refined h2{font-size:18px;font-weight:600;line-height:1.25;letter-spacing:-.3px;margin:12px 0 8px}
#gym-studio-refined h3{font-size:14px;font-weight:600;margin:14px 0 6px}
#gym-studio-refined p{margin:8px 0 12px}
#gym-studio-refined .sr-sub{font-size:12px;color:var(--secondary)}
#gym-studio-refined .sr-kicker{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--secondary)}
#gym-studio-refined .sr-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
#gym-studio-refined .sr-button{font:inherit;min-height:44px;min-width:44px;border:0;border-radius:var(--radius);padding:8px 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--surface);color:var(--text);font-size:13px;font-weight:550;box-sizing:border-box;text-align:center}
#gym-studio-refined .sr-button:disabled{opacity:.4;cursor:default}
#gym-studio-refined .sr-primary{background:var(--action);color:var(--on-action);min-height:48px}
#gym-studio-refined .sr-plain{background:transparent;padding:8px 3px}
#gym-studio-refined .sr-wide{width:100%}
#gym-studio-refined .sr-icon{padding:10px;width:44px;flex-shrink:0;background:transparent}
#gym-studio-refined .sr-hero{background:var(--surface);padding:14px;border-radius:18px;margin:12px 0 6px}
#gym-studio-refined .sr-hero h2{font-family:var(--heading);font-size:25px;font-weight:400;margin:0 0 4px}
#gym-studio-refined .sr-hero .sr-button{margin-top:12px}
#gym-studio-refined .sr-item{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);min-height:58px}
#gym-studio-refined .sr-itembutton{font:inherit;color:var(--text);text-align:left;display:flex;align-items:center;gap:10px;background:transparent;border:0;min-height:58px;padding:9px 0;flex:1;min-width:0}
#gym-studio-refined .sr-itembutton[aria-current=true]{color:var(--action)}
#gym-studio-refined .sr-itemname{font-size:14px;font-weight:550;display:block;line-height:1.3}
#gym-studio-refined .sr-index{font:11px ui-monospace,monospace;color:var(--secondary);min-width:17px}
#gym-studio-refined .sr-itemcopy{flex:1;min-width:0}
#gym-studio-refined .sr-itemstatus{display:block;font-size:11px;color:var(--secondary);margin-top:3px}
#gym-studio-refined .sr-reorder{display:flex;gap:0;flex-shrink:0}
#gym-studio-refined .sr-rest{padding:10px 12px;border-radius:var(--radius);background:var(--selected);margin:10px 0}
#gym-studio-refined .sr-rest strong{font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
#gym-studio-refined .sr-status{color:var(--secondary);font-size:12px;margin:8px 0;min-height:17px}
#gym-studio-refined .sr-error{color:var(--error);font-size:12px}
#gym-studio-refined .sr-entry{display:grid;grid-template-columns:1fr 1fr;gap:12px;background:var(--surface);border-radius:18px;padding:12px;margin:12px 0}
#gym-studio-refined label{display:block;color:var(--secondary);font-size:12px;margin:8px 0}
#gym-studio-refined input,#gym-studio-refined select{font:inherit;font-size:16px;min-height:44px;width:100%;min-width:0;box-sizing:border-box;background:var(--surface);color:var(--text);border:0;border-radius:12px;padding:10px}
#gym-studio-refined input::placeholder{color:var(--secondary);opacity:1}
#gym-studio-refined .sr-entry label{margin:0}
#gym-studio-refined .sr-entry input{background:transparent;padding:4px 0;font-size:43px;font-weight:450;letter-spacing:-1.5px;appearance:textfield;min-height:62px}
#gym-studio-refined .sr-entry input::-webkit-inner-spin-button{appearance:none}
#gym-studio-refined .sr-steppers{display:flex;gap:6px}
#gym-studio-refined .sr-steppers button{flex:1;background:var(--canvas);font-size:18px}
#gym-studio-refined .sr-toolbar{margin:8px 0;display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
#gym-studio-refined .sr-footer{padding:0 18px 16px}
#gym-studio-refined .sr-nav{display:flex;justify-content:space-around;gap:6px;padding:8px 12px 15px}
#gym-studio-refined .sr-nav button{background:transparent;flex:1;font-size:12px;padding:8px}
#gym-studio-refined .sr-nav button[aria-current=page]{background:var(--surface)}
#gym-studio-refined .sr-days{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
#gym-studio-refined .sr-days button[aria-pressed=true],#gym-studio-refined .sr-filter[aria-pressed=true]{background:var(--action);color:var(--on-action)}
#gym-studio-refined .sr-divider{height:1px;background:var(--line);margin:12px 0}
#gym-studio-refined .sr-stat{font-size:31px;letter-spacing:-1px;font-weight:450}
#gym-studio-refined .sr-two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
#gym-studio-refined .sr-checkrow{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:44px;border-bottom:1px solid var(--line)}
#gym-studio-refined .sr-saveorder{margin-top:16px}
@media(max-width:350px){#gym-studio-refined .sr-main{padding:8px 12px 14px}#gym-studio-refined .sr-header{padding:0 12px}#gym-studio-refined .sr-footer{padding:0 12px 14px}#gym-studio-refined h1{font-size:27px}#gym-studio-refined .sr-entry{gap:8px;padding:10px}#gym-studio-refined .sr-stage{padding:16px 0}}
</style>
<div class="sr-stage viz-dotted-background"><div class="sr-preview" aria-label="Refined Studio workout preview"></div></div>
<script>
(()=>{
const root=document.getElementById('gym-studio-refined'),host=root.querySelector('.sr-preview');
const library=[{id:1,name:'Dumbbell bench press',equipment:'Dumbbell',muscle:'Chest'},{id:2,name:'Lat pulldown',equipment:'Cable',muscle:'Back'},{id:3,name:'Dumbbell shoulder press',equipment:'Dumbbell',muscle:'Shoulders'},{id:4,name:'Dumbbell one-arm row',equipment:'Dumbbell',muscle:'Back'},{id:5,name:'Dumbbell bent-over row',equipment:'Dumbbell',muscle:'Back'},{id:6,name:'Dumbbell incline row',equipment:'Dumbbell',muscle:'Back'},{id:7,name:'Dumbbell biceps curl',equipment:'Dumbbell',muscle:'Arms'}];
const fresh=()=>({screen:'train',theme:'Studio',appearance:'System',name:'Upper body',routine:[1,2,3,4,7],order:[1,2,3,4,7],days:[0,3],active:false,finished:false,exercise:1,drafts:{},logged:[],rest:0,notice:'',error:'',query:'',filter:'All',selected:[],searchTarget:'plan',orderTarget:'workout',detail:0});
let s=window.openai?.widgetState?.privateContent?.version===3?{...fresh(),...window.openai.widgetState.privateContent.state}:fresh();
const screens={train:'Train',workout:'Workout lineup',log:'Log sets',order:'Reorder lineup',finish:'Finish review',plan:'Your routine',search:'Find exercises',progress:'Progress',summary:'Session summary',settings:'Theme & settings'};
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const item=id=>library.find(e=>e.id===id),icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const button=(label,action,attrs='',cls='')=>`<button type="button" class="sr-button cursor-interaction ${cls}" data-action="${action}" ${attrs}>${label}</button>`;
const draft=()=>s.drafts[s.exercise]||(s.drafts[s.exercise]={weight:'30',reps:'10'});
const count=id=>s.logged.filter(v=>v.exercise===id).length;
const target=()=>s.searchTarget==='workout'?s.order:s.routine;
function persist(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{proposal:'Studio refined',approvedDirection:'Studio',theme:s.theme,screen:s.screen,lineup:s.order.map(id=>item(id).name)},privateContent:{version:3,state:s}}).catch(()=>{});}
function rest(){return s.rest?`<div class="sr-rest sr-row"><div><span class="sr-sub">Rest · preview </span><strong>${Math.floor(s.rest/60)}:${String(s.rest%60).padStart(2,'0')}</strong></div><div>${button('+30s','rest-more','','sr-plain')}${button('Skip','rest-skip','','sr-plain')}</div></div>`:'';}
function lineup(ids,mode){return ids.map((id,i)=>`<div class="sr-item" data-exercise="${id}">${mode==='reorder'?`<span class="sr-index">${i+1}</span><div class="sr-itemcopy"><span class="sr-itemname">${esc(item(id).name)}</span><span class="sr-itemstatus">${s.orderTarget==='workout'?count(id)+' sets completed':'3 planned sets'}</span></div><div class="sr-reorder">${button(icon('arrow-up'),'move',`data-id="${id}" data-direction="-1" aria-label="Move ${esc(item(id).name)} up" ${i===0?'disabled':''}`,'sr-icon')}${button(icon('arrow-down'),'move',`data-id="${id}" data-direction="1" aria-label="Move ${esc(item(id).name)} down" ${i===ids.length-1?'disabled':''}`,'sr-icon')}</div>`:`<button type="button" class="sr-itembutton cursor-interaction" data-action="${mode==='workout'?'choose':'detail'}" data-id="${id}"><span class="sr-index">${i+1}</span><span class="sr-itemcopy"><span class="sr-itemname">${esc(item(id).name)}</span><span class="sr-itemstatus">${mode==='workout'?(count(id)?(count(id)>=3?'✓ '+count(id)+' sets completed':count(id)+' / 3 sets completed'):'Not started · 3 sets'):'3 sets · '+item(id).muscle}</span></span>${icon(mode==='workout'?'chevron-right':'info')}</button>`}</div>`).join('');}
function results(){const q=s.query.toLowerCase().replace(/\bdb\b/g,'dumbbell').replace(/rows\b/g,'row').split(/[^a-z0-9]+/).filter(Boolean),rows=library.filter(e=>q.every(w=>e.name.toLowerCase().includes(w))&&(s.filter==='All'||e.equipment===s.filter));return `<div class="sr-sub" role="status">${rows.length} matches · sample catalog</div>${rows.map(e=>`<div class="sr-item"><button type="button" class="sr-itembutton cursor-interaction" data-action="detail" data-id="${e.id}" aria-label="Details for ${e.name}"><span class="sr-itemcopy"><span class="sr-itemname">${e.name}</span><span class="sr-itemstatus">${e.equipment} · ${e.muscle}</span></span></button>${button(target().includes(e.id)?'✓ Added':s.selected.includes(e.id)?'✓ Selected':'Select','select',`data-id="${e.id}" ${target().includes(e.id)?'disabled':''} aria-pressed="${s.selected.includes(e.id)}"`,s.selected.includes(e.id)?'sr-primary':'sr-plain')}</div>`).join('')}${!rows.length?'<h2>No matches</h2><p class="sr-sub">Try a shorter name or remove the equipment filter.</p>':''}`;}
function render(){let body='',footer='',nav=false;host.style.colorScheme=s.appearance==='System'?'light dark':s.appearance.toLowerCase();
if(s.screen==='train'){nav=true;body=`<div class="sr-kicker">Saturday, October 10</div><h1>Ready to train?</h1><div class="sr-hero"><h2>${esc(s.name)}</h2><div class="sr-sub">${s.active?s.order.length:s.routine.length} exercises · ${s.days.map(i=>['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]).join(' / ')||'Unscheduled'}</div>${button(s.active?'Resume workout':'Start workout','start','','sr-primary sr-wide')}</div><div class="sr-toolbar"><h3>Your lineup</h3>${button('Edit routine','nav','data-screen="plan"','sr-plain')}</div>${lineup(s.routine,'plan')}`;
}else if(s.screen==='workout'){body=`<div class="sr-row"><div><div class="sr-kicker">Workout</div><h1>${esc(s.name)}</h1></div>${button('Finish','nav','data-screen="finish"','sr-plain')}</div><div class="sr-row"><span class="sr-sub">${s.order.length} exercises · ${s.logged.length} sets completed</span>${button('Reorder','reorder','data-target="workout"','sr-plain')}</div><p class="sr-sub">Choose any exercise. Go in your own order.</p>${lineup(s.order,'workout')}${button(icon('plus')+' Add exercise','open-search','data-target="workout"','sr-plain sr-wide')}${rest()}<div class="sr-status" role="status">${esc(s.notice)}</div>`;footer='<div class="sr-sub">Watch unavailable · set logging is ready</div>';
}else if(s.screen==='log'){const d=draft(),e=item(s.exercise),done=s.logged.filter(v=>v.exercise===s.exercise);body=`<div class="sr-toolbar">${button(icon('list')+' All '+s.order.length+' exercises','nav','data-screen="workout"','sr-plain')}<span class="sr-sub">${s.order.indexOf(s.exercise)+1} of ${s.order.length}</span></div><h1>${e.name}</h1><div class="sr-row"><span class="sr-sub">Set ${done.length+1} · ${done.length} completed</span>${button('Guide','detail',`data-id="${e.id}"`,'sr-plain')}</div><div class="sr-row"><span class="sr-sub">Last time · sample</span><span class="sr-sub">30 lb × 10</span></div><div class="sr-entry"><div><label>Weight · lb<input type="number" min="0" step="0.5" inputmode="decimal" data-field="weight" value="${esc(d.weight)}" aria-label="Weight in pounds"></label><div class="sr-steppers">${button('−','adjust','data-key="weight" data-delta="-2.5" aria-label="Reduce weight by 2.5 pounds"')}${button('+','adjust','data-key="weight" data-delta="2.5" aria-label="Increase weight by 2.5 pounds"')}</div></div><div><label>Reps<input type="number" min="1" step="1" inputmode="numeric" data-field="reps" value="${esc(d.reps)}" aria-label="Repetitions"></label><div class="sr-steppers">${button('−','adjust','data-key="reps" data-delta="-1" aria-label="One fewer rep"')}${button('+','adjust','data-key="reps" data-delta="1" aria-label="One more rep"')}</div></div></div><div class="sr-error" role="alert">${esc(s.error)}</div>${button('Complete set '+icon('check'),'complete','','sr-primary sr-wide')}<div class="sr-status" role="status">${esc(s.notice||'Draft values · complete to record')}</div>${rest()}${done.length?'<h3>Completed sets</h3>':''}${s.logged.map((v,i)=>v.exercise===s.exercise?`<div class="sr-checkrow"><span>✓ ${v.weight} lb × ${v.reps}</span>${button('Undo','undo',`data-id="${i}"`,'sr-plain')}</div>`:'').join('')}`;footer=button('Choose another exercise '+icon('list'),'nav','data-screen="workout"','sr-wide');
}else if(s.screen==='order'){const ids=s.orderTarget==='workout'?s.order:s.routine;body=`<div class="sr-kicker">${s.orderTarget==='workout'?'This session only':'Your saved routine'}</div><h1>Set your order</h1><p class="sr-sub">Move exercises up or down. Logged sets stay with their exercise.</p>${lineup(ids,'reorder')}${s.orderTarget==='workout'?button('Save lineup to routine','save-lineup','','sr-saveorder sr-wide'):''}<div class="sr-status" role="status">${esc(s.notice)}</div>`;footer=button('Done','nav',`data-screen="${s.orderTarget==='workout'?'workout':'plan'}"`,'sr-primary sr-wide');
}else if(s.screen==='plan'){body=`<h1>Your routine</h1><label>Routine name<input data-field="name" value="${esc(s.name)}" maxlength="45"></label><label>Training days</label><div class="sr-days">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map((v,i)=>button(v,'day',`data-id="${i}" aria-pressed="${s.days.includes(i)}"`)).join('')}</div><div class="sr-toolbar"><h3>${s.routine.length} exercises</h3>${button('Reorder','reorder','data-target="plan"','sr-plain')}</div>${lineup(s.routine,'plan')}${button('+ Add exercises','open-search','data-target="plan"','sr-plain sr-wide')}`;footer=button('Save routine','save-plan','','sr-primary sr-wide');
}else if(s.screen==='search'){body=`<div class="sr-row"><h1>Add exercises</h1>${button('Done','nav',`data-screen="${s.searchTarget==='workout'?'workout':'plan'}"`,'sr-plain')}</div><label>Search<input type="search" data-field="query" value="${esc(s.query)}" placeholder="Try dumbbell row" autocomplete="off"></label><div class="sr-toolbar">${['All','Dumbbell','Cable'].map(v=>button(v,'filter',`data-value="${v}" aria-pressed="${s.filter===v}"`,'sr-filter')).join('')}</div><div data-results>${results()}</div><p class="sr-sub">ExerciseDB / AscendAPI · sample data</p>`;footer=`<div class="sr-row"><span class="sr-sub">${s.selected.length} selected</span>${button('Add to '+(s.searchTarget==='workout'?'workout':'routine'),'add',s.selected.length?'':'disabled','sr-primary')}</div><div class="sr-status" role="status">${esc(s.notice)}</div>`;
}else if(s.screen==='settings'){body=`<h1>Make it yours</h1><label>Theme<select data-field="theme">${['Studio','Velocity'].map(t=>`<option ${s.theme===t?'selected':''}>${t}</option>`).join('')}</select></label><label>Appearance<select data-field="appearance">${['System','Light','Dark'].map(t=>`<option ${s.appearance===t?'selected':''}>${t}</option>`).join('')}</select></label><p class="sr-sub">Your theme changes the look. Your workout stays exactly where you left it.</p><div class="sr-divider"></div><h2>Apple Watch</h2><p class="sr-sub">Not connected in this preview. Weight and reps work independently of Watch measurements.</p>`;footer=button(s.active?'Return to workout':'Back to Train','nav',`data-screen="${s.active?'workout':'train'}"`,'sr-primary sr-wide');
}else if(s.screen==='finish'){body=`<h1>Finish workout?</h1><div class="sr-two"><div><div class="sr-stat">${s.logged.length}</div><span class="sr-sub">Completed sets</span></div><div><div class="sr-stat">${new Set(s.logged.map(v=>v.exercise)).size}</div><span class="sr-sub">Exercises logged</span></div></div><p class="sr-sub">Only completed sets enter your history. Unfinished drafts are excluded.</p>${button('Keep training','nav','data-screen="workout"','sr-wide')}`;footer=button('Save session','finish',s.logged.length?'':'disabled','sr-primary sr-wide');
}else if(s.screen==='summary'){const vol=s.logged.reduce((n,v)=>n+v.weight*v.reps,0);body=`<h1>${s.finished?'Session saved':'Session summary'}</h1><p class="sr-sub">${esc(s.name)}</p><div class="sr-two"><div><div class="sr-stat">${s.logged.length}</div><span class="sr-sub">Completed sets</span></div><div><div class="sr-stat">${vol.toLocaleString()}</div><span class="sr-sub">Volume · lb</span></div></div><h3>Apple Health</h3><div class="sr-checkrow"><span>Heart rate</span><span class="sr-sub">Unavailable</span></div><div class="sr-checkrow"><span>Active calories</span><span class="sr-sub">Unavailable</span></div><h3>Completed work</h3>${s.logged.map(v=>`<div class="sr-item"><div class="sr-itemcopy"><span class="sr-itemname">${item(v.exercise).name}</span><span class="sr-itemstatus">${v.weight} lb × ${v.reps}</span></div></div>`).join('')}`;footer=button('Back to Train','nav','data-screen="train"','sr-primary sr-wide');
}else if(s.screen==='progress'){nav=true;body=`<h1>Your progress</h1><h2>Latest session</h2>${s.finished?`<div class="sr-row"><div><strong>${esc(s.name)}</strong><p class="sr-sub">${s.logged.length} completed sets</p></div>${button('View','nav','data-screen="summary"','sr-plain')}</div>`:'<p class="sr-sub">Finish a preview workout to see your completed sets here.</p>'}<div class="sr-divider"></div><p class="sr-sub">Long-term exercise trends and full history will remain available in the app.</p>`;}
if(s.detail){const e=item(s.detail);body=`<h1>${e.name}</h1><p class="sr-sub">${e.equipment} · ${e.muscle}</p><div class="sr-hero"><h2>Exercise guide</h2><p class="sr-sub">Demonstration placement only. A clearer media source remains a separate decision.</p></div>`;footer=button('Back','close-detail','','sr-primary sr-wide');nav=false;}
const backScreen=s.detail?'close-detail':s.screen==='log'?'lineup':'home';host.innerHTML=`<div class="sr-review"><span>STUDIO · REFINED</span><select data-field="jump" aria-label="Preview screen">${Object.entries(screens).map(([k,v])=>`<option value="${k}" ${s.screen===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="sr-app" data-theme="${s.theme}"><div class="sr-safe"><span>9:41</span><span>PREVIEW</span></div><header class="sr-header"><span class="sr-brand">gymlog.</span><div>${s.screen!=='train'?button(icon('arrow-left'),backScreen,'aria-label="Back"','sr-icon'):''}${button(icon('sliders-horizontal'),'nav','data-screen="settings" aria-label="Theme and settings"','sr-icon')}</div></header><main class="sr-main">${body}</main>${footer?'<div class="sr-footer">'+footer+'</div>':''}${nav?`<nav class="sr-nav" aria-label="Main navigation">${[['train','Train'],['plan','Plan'],['progress','Progress']].map(([k,v])=>button(v,'nav',`data-screen="${k}" ${s.screen===k?'aria-current="page"':''}`)).join('')}</nav>`:''}</div><div class="sr-review" style="margin:10px 0 0">Interactive preview · sample data</div>`;if(globalThis.lucide)lucide.createIcons({attrs:{width:17,height:17}});}
host.addEventListener('input',e=>{const k=e.target.dataset.field;if(!['name','query','weight','reps'].includes(k))return;if(k==='name')s.name=e.target.value;if(k==='weight'||k==='reps'){draft()[k]=e.target.value;s.notice='Draft updated · complete to record';host.querySelector('.sr-status').textContent=s.notice;}if(k==='query'){s.query=e.target.value;host.querySelector('[data-results]').innerHTML=results();}persist();});
host.addEventListener('change',e=>{const k=e.target.dataset.field;if(!['jump','theme','appearance'].includes(k))return;if(k==='jump'){s.screen=e.target.value;s.detail=0;s.notice='';}if(k==='theme'||k==='appearance')s[k]=e.target.value;render();persist();});
host.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,id=Number(b.dataset.id);s.error='';
if(a==='nav'){s.screen=b.dataset.screen;s.notice='';}if(a==='home')s.screen='train';if(a==='lineup')s.screen='workout';
if(a==='start'){if(!s.routine.length){s.screen='plan';}else{if(!s.active){s.order=[...s.routine];s.logged=[];s.drafts={};s.rest=0;s.finished=false;s.notice='';}s.active=true;s.screen='workout';}}
if(a==='choose'){s.exercise=id;s.screen='log';s.notice='';}
if(a==='reorder'){s.orderTarget=b.dataset.target;s.screen='order';s.notice='';}
if(a==='move'){const ids=s.orderTarget==='workout'?s.order:s.routine,i=ids.indexOf(id),j=i+Number(b.dataset.direction);if(i>=0&&j>=0&&j<ids.length){[ids[i],ids[j]]=[ids[j],ids[i]];s.notice=item(id).name+' moved to position '+(j+1)+'.';}}
if(a==='save-lineup'){s.routine=[...s.order];s.notice='Lineup saved to your routine for future sessions.';}
if(a==='save-plan'){s.name=s.name.trim()||'My routine';s.screen='train';}
if(a==='day')s.days=s.days.includes(id)?s.days.filter(v=>v!==id):[...s.days,id].sort();
if(a==='open-search'){s.searchTarget=b.dataset.target;s.selected=[];s.notice='';s.screen='search';}
if(a==='filter')s.filter=b.dataset.value;if(a==='select')s.selected=s.selected.includes(id)?s.selected.filter(v=>v!==id):[...s.selected,id];
if(a==='add'){const ids=target();s.selected.forEach(id=>{if(!ids.includes(id))ids.push(id);});s.notice='Added '+s.selected.length+'. Keep searching.';s.selected=[];}
if(a==='detail')s.detail=id;if(a==='close-detail')s.detail=0;
if(a==='adjust'){const d=draft(),k=b.dataset.key;d[k]=String(Math.max(k==='weight'?0:1,Number(d[k]||0)+Number(b.dataset.delta)));s.notice='Draft updated · complete to record';}
if(a==='complete'){const d=draft();if(!d.weight.trim()||!Number.isFinite(Number(d.weight))||Number(d.weight)<0||!Number.isInteger(Number(d.reps))||Number(d.reps)<1)s.error='Enter a valid weight and at least one whole rep.';else{s.logged.push({exercise:s.exercise,weight:Number(d.weight),reps:Number(d.reps)});s.rest=90;s.notice='Set completed. Continue or choose another exercise.';}}
if(a==='undo'){const v=s.logged.splice(id,1)[0];s.drafts[v.exercise]={weight:String(v.weight),reps:String(v.reps)};s.rest=0;s.notice='Completion undone. Values kept as a draft.';}
if(a==='rest-more')s.rest+=30;if(a==='rest-skip')s.rest=0;
if(a==='finish'){s.finished=true;s.active=false;s.rest=0;s.screen='summary';}
render();persist();});
window.addEventListener('openai:set_globals',e=>{const p=e.detail?.globals?.widgetState?.privateContent;if(p?.version===3){s={...fresh(),...p.state};render();}});
render();
})();
</script>
</div>
